---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odf-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  sources:
    - repoURL: 'https://github.com/redhat-cop/gitops-catalog'
      targetRevision: agent
      path: openshift-data-foundation-operator/operator/overlays/stable-4.18
  project: default
  syncPolicy:
    automated:
      prune: false
      allowEmpty: true
