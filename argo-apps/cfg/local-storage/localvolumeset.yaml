---
apiVersion: "local.storage.openshift.io/v1alpha1"
kind: LocalVolumeSet
metadata:
  name: local-block
  namespace: openshift-local-storage
spec:
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: cluster.ocs.openshift.io/openshift-storage
            operator: In
            values:
              - ""
  tolerations:
      - key: "node.ocs.openshift.io/storage"
        operator: Exists
  storageClassName: local-sdb
  volumeMode: Block
  fstype: ext4
  maxDeviceCount: 1  # <-- Maximum number of devices per node to be used
  deviceInclusionSpec:
    deviceTypes:
    - disk
    deviceMechanicalProperties:
    - NonRotational   # <-- For HDD change to Rotational
    minSize: 1Ti   # <-- Uncomment and modify to limit the minimum size of disk used
    maxSize: 1Ti   # <-- Uncomment and modify to limit the maximum size of disk used
