---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-net-cfg
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  sources:
    - repoURL: 'https://github.com/dlbewley/demo-virt'
      targetRevision: HEAD
      path: networking/overlays/homelab
  project: default
  syncPolicy:
    automated:
      prune: false
      allowEmpty: true
